            // Trả về mock data chỉ trong trường hợp không tìm thấy storage, 
            // nhưng API call sẽ phụ thuộc vào việc client/backend đã setup data đúng.
            return { cccd: "0123456789", walletAddress: "0x41DBDD4C90bFDFedDb077282Dbf0fB6755FBdbb9" };
        }
        return { cccd: cccd, walletAddress: wallet };
    }

    // ===================================
    // 🖼️ PHẦN 1: XỬ LÝ ẢNH (CỘT TRÁI)
    // ===================================

    // 1.1. Nút Upload ảnh
    function rescue_uploadImage() {
      document.getElementById('rescue-file-input').click();
    }

    // 1.2. Chụp ảnh từ camera (Giữ nguyên logic tạo file)
    async function rescue_captureFromCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.createElement("video");
        video.srcObject = stream;
        video.play();

        const modal = document.createElement("div");
        modal.className =
          "fixed inset-0 bg-black bg-opacity-70 flex flex-col items-center justify-center z-50";

        modal.innerHTML = `
          <video autoplay playsinline class="rounded-xl shadow-lg border-4 border-white w-[90%] max-w-md"></video>
          <div class="mt-4 flex gap-4">
            <button id="rescue-capture-btn" class="ai-rescue-btn text-white px-5 py-2 rounded-lg rescue-btn-camera">📸 Chụp</button>
            <button id="rescue-cancel-btn" class="bg-gray-500 hover:bg-gray-600 text-white px-5 py-2 rounded-lg rescue-btn-secondary">Hủy</button>
          </div>
        `;
        modal.querySelector("video").srcObject = stream;
        document.body.appendChild(modal);

        modal.querySelector("#rescue-cancel-btn").onclick = () => {
          stream.getTracks().forEach((track) => track.stop());
          modal.remove();
        };

        modal.querySelector("#rescue-capture-btn").onclick = async () => {
          const canvas = document.createElement("canvas");
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext("2d").drawImage(video, 0, 0);
          stream.getTracks().forEach((track) => track.stop());

          const blob = await new Promise((resolve) =>
            canvas.toBlob(resolve, "image/jpeg")
          );
          const file = new File([blob], "Captured.jpg", { type: "image/jpeg" });

          modal.remove();
          rescue_handleFileProcessing(file); 
        };
      } catch (err) {
        alert("Không thể truy cập camera. Vui lòng cấp quyền truy cập!");
        console.error("Camera error:", err);
      }
    }

    // 1.3. Xử lý hiển thị
    function rescue_showAnalysisUI(showProgressBar = false) {
      const listView = document.getElementById('rescue-list-view');
      if (listView) listView.classList.add('hidden');

      document.getElementById("rescue-analysis-section").classList.remove("hidden");
      document.getElementById("rescue-results-section").classList.add("hidden");
      document.getElementById("rescue-loading-animation").style.display = showProgressBar ? "block" : "none";
    }

    function rescue_previewImage(src) {
      document.getElementById("rescue-preview-image").src = src;
      document.querySelector('#rescue-analysis-section p.mt-2').textContent = "Ảnh gốc";
    }

    // 1.4. Gọi API phân tích ảnh (*** ĐÃ SỬA: POST FILE DATA ***)
    async function rescue_startAnalysis(file) {
      document.getElementById("rescue-loading-animation").style.display = "block";

      const loadingText = document.getElementById("rescue-loading-text");
      const progressBar = document.getElementById("rescue-progress-bar");
      const loadingAnimation = document.getElementById("rescue-loading-animation");

      const fixedLoadingTime = 5000;
      const delayPerMessage = fixedLoadingTime / rescueLoadingMessages.length;
      let progress = 0;
      
      // Chuẩn bị FormData để gửi ảnh thật
      const formData = new FormData();
      formData.append('file', file); // 'file' là tên trường UploadFile trong FastAPI

      // Gửi yêu cầu và tiến hành mô phỏng loading
      const apiCall = fetch(
        "http://localhost:3004/ai-rescue", // ENDPOINT ĐÚNG
        {
          method: 'POST', 
          body: formData, // Gửi ảnh
        }
      )
        .then(async (res) => {
          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`Lỗi API (${res.status}): ${errorText.substring(0, 100)}...`);
          }
          return res.json();
        });
      
      // Giả lập progress bar
      for (let msg of rescueLoadingMessages) {
        loadingText.textContent = msg;
        progress += 100 / rescueLoadingMessages.length;
        progressBar.style.width = `${progress}%`;
        await new Promise((r) => setTimeout(r, delayPerMessage));
      }
      
      // Đợi kết quả thực
      try {
        const data = await apiCall;
        
        // Cập nhật ảnh preview sang ảnh kết quả đã xử lý
        if (data.link_anh_api) {
          document.getElementById("rescue-preview-image").src = data.link_anh_api;
          document.querySelector('#rescue-analysis-section p.mt-2').textContent = "Ảnh đã được AI phân tích";
        }
        
        rescue_showResults(data);
        
      } catch (e) {
        // Xử lý lỗi khi API thật thất bại
        loadingAnimation.style.display = "none";
        document.getElementById("rescue-results-section").classList.remove("hidden");
        document.getElementById("rescue-result-details").innerHTML = `<p class="text-lg text-red-500"><strong>❌ LỖI KẾT NỐI/PHÂN TÍCH</strong></p><p class="text-gray-400">Không thể nhận phản hồi từ máy chủ phân tích: ${e.message}.</p>`;
        
        // Gửi tin nhắn tự động thông báo lỗi nếu cần
        rescue_sendChatMessage(`Không thể phân tích ảnh do lỗi API: ${e.message}. Vui lòng đưa ra hướng dẫn sơ cứu tổng quát.`, true);
      }
    }

    // 1.5. Hiển thị kết quả (Giữ nguyên logic)
    function rescue_showResults(data) {
      document.getElementById("rescue-loading-animation").style.display = "none";
      document.getElementById("rescue-results-section").classList.remove("hidden");

      // Kiểm tra dữ liệu trả về có hợp lệ không (tên_benh/tinh_trang là bắt buộc)
      if (!data || (!data.ten_benh && !data.tinh_trang)) {
        document.getElementById("rescue-result-details").innerHTML = `<p class="text-lg text-red-500"><strong>Lỗi Dữ liệu:</strong> Phản hồi từ API không chứa thông tin tình trạng hợp lệ.</p><p class="text-gray-400">Vui lòng kiểm tra cấu trúc dữ liệu trả về của máy chủ.</p>`;
        return;
      }

      const moTaHTML =
        data.mo_ta || "";
      const khuyenNghiHTML =
        data.khuyen_nghi || "";

      document.getElementById("rescue-result-details").innerHTML = `
        <p class="text-lg text-gray-100"><strong>Tình trạng:</strong> <span class="text-red-400 font-bold">${
          data.ten_benh || data.tinh_trang
        }</span></p>
        <p class="text-gray-200"><strong>Mức độ:</strong> <span class="font-semibold">${
          data.muc_do || 'Chưa xác định'
        }</span></p>
        <p class="text-gray-200"><strong>Độ chính xác:</strong> ${Math.round(
          (data.do_chinh_xac || 0) * 100
        )}%</p>

        <div class="mt-4">
          <p class="font-semibold text-gray-100">Mô tả:</p>
          <div class="prose-rescue max-w-none text-gray-300">${moTaHTML.replace(/\n/g, '<br>')}</div>
        </div>

        <div class="mt-4">
          <p class="font-semibold text-gray-100">Khuyến nghị khẩn cấp:</p>
          <div class="prose-rescue max-w-none text-gray-300">${khuyenNghiHTML.replace(/\n/g, '<br>')}</div>
        </div>
      `;

      // Tự động gửi tin nhắn đầu tiên cho AI Chat dựa trên kết quả
      const aiInput = `Đưa ra cách sở cứu, hoặc cách giải quyết trình trạng trên 1 cách nhanh nhất: ${
        data.tinh_trang || data.ten_benh
      }. ${data.mo_ta ? data.mo_ta.replace(/\*\*/g, "") : ''}`;
      rescue_sendChatMessage(aiInput, true); // true = gửi tự động
    }

    // 1.5b. HÀM XỬ LÝ TRUNG GIAN (Điều phối giữa Timeline và AI)
    function rescue_handleFileProcessing(file) {
      rescue_showAnalysisUI(false);
      document.getElementById("rescue-results-section").classList.add("hidden");
      rescue_previewImage(URL.createObjectURL(file));

      const guideLoader = document.getElementById('rescue-guide-loader');
      if (guideLoader) guideLoader.style.display = 'flex';
      
      const guideLoaderText = document.getElementById('rescue-guide-loader-text');
      if (guideLoaderText) guideLoaderText.textContent = "Đang xử lý ảnh...";

      const minDelay = 1000; 
      const maxDelay = 2000; 
      const randomDelay = Math.floor(Math.random() * (maxDelay - minDelay + 1)) + minDelay;

      // Chạy tiến trình xử lý ngắn (giả lập)
      setTimeout(() => {
        if (guideLoader) guideLoader.style.display = 'none';
        
        // Sau khi xử lý ảnh (giả định), ta quyết định có phải là file hướng dẫn không
        if (firstAidGuides.has(file.name)) {
          rescue_showTimelinePopup(file.name);
        } else {
          // Nếu không phải file hướng dẫn -> Chạy phân tích AI thật
          rescue_startAnalysis(file); 
        }
      }, randomDelay);
    }


    // =========================================
    // 📖 PHẦN 1B: DANH SÁCH & TIMELINE (Giữ nguyên logic)
    // =========================================

    // 1.6. (MỚI) Hiển thị danh sách sơ cứu
    function rescue_showFirstAidList() {
      const listView = document.getElementById('rescue-list-view');
      const analysisView = document.getElementById('rescue-analysis-section');
      
      // Ẩn khu vực phân tích
      analysisView.classList.add('hidden');
      
      // Xóa nội dung cũ và tạo danh sách
      listView.innerHTML = '';
      listView.classList.remove('hidden');

      firstAidGuides.forEach((guide, key) => {
        const item = document.createElement('div');
        item.className = 'first-aid-list-item';
        item.innerHTML = `
          <div class="icon">
            <i class="bi ${guide.icon}"></i>
          </div>
          <h4>${guide.title}</h4>
        `;
        // Khi nhấn vào item, mở timeline
        item.onclick = () => {
            const guideLoader = document.getElementById('rescue-guide-loader');
            const guideLoaderText = document.getElementById('rescue-guide-loader-text');
            if (guideLoader) guideLoader.style.display = 'flex';
            if (guideLoaderText) guideLoaderText.textContent = "Đang tải hướng dẫn sơ cứu...";

            setTimeout(() => {
                if (guideLoader) guideLoader.style.display = 'none';
                rescue_showTimelinePopup(key);
            }, 500); 
        };
        listView.appendChild(item);
      });
    }

    // 1.7. (MỚI) Hiển thị Popup Timeline
    function rescue_showTimelinePopup(imageName) {
      if (!firstAidGuides.has(imageName)) return;

      rescueCurrentStep = 0;
      rescueCurrentGuideKey = imageName;
      
      const guide = firstAidGuides.get(imageName);
      const modal = document.getElementById('rescue-timeline-modal');
      const titleEl = document.getElementById('rescue-timeline-title');
      const stepsEl = document.getElementById('rescue-timeline-steps');

      titleEl.textContent = guide.title;
      stepsEl.innerHTML = ''; 

      guide.steps.forEach((step, index) => {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'timeline-step';
        stepDiv.innerHTML = `
          <div class="step-circle">${index + 1}</div>
          <div class="step-title">${step.title}</div>
        `;
        stepsEl.appendChild(stepDiv);
      });
      
      rescue_updateTimelineContent();
      
      document.getElementById('rescue-map-container').style.display = 'none';
      document.getElementById('rescue-map-container').innerHTML = '';
      
      modal.style.display = 'flex';
    }

    // 1.8. Cập nhật nội dung và trạng thái Timeline (*** ĐÃ CẬP NHẬT VIDEO & MAP ***)
    function rescue_updateTimelineContent() {
      if (!rescueCurrentGuideKey) return;

      const guide = firstAidGuides.get(rescueCurrentGuideKey);
      const stepData = guide.steps[rescueCurrentStep];
      
      const contentEl = document.getElementById('rescue-timeline-content');
      const stepsEls = document.querySelectorAll('#rescue-timeline-steps .timeline-step');
      const backBtn = document.getElementById('rescue-timeline-back');
      const nextBtn = document.getElementById('rescue-timeline-next');
      const endBtn = document.getElementById('rescue-timeline-end'); 
      
      const toolsBtn = document.getElementById('rescue-timeline-tools-btn');
      const mapContainer = document.getElementById('rescue-map-container');

      // Cập nhật nội dung
      contentEl.innerHTML = stepData.content;

      // Cập nhật trạng thái (active/completed)
      stepsEls.forEach((stepEl, index) => {
        stepEl.classList.remove('active', 'completed');
        if (index < rescueCurrentStep) {
          stepEl.classList.add('completed');
        } else if (index === rescueCurrentStep) {
          stepEl.classList.add('active');
        }
      });

      // Ẩn/hiện nút 
      backBtn.style.display = (rescueCurrentStep === 0) ? 'none' : 'flex';
      
      if (rescueCurrentStep === guide.steps.length - 1) {
        nextBtn.style.display = 'none';
        endBtn.style.display = 'flex'; 
      } else {
        nextBtn.style.display = 'flex';
        endBtn.style.display = 'none'; 
      }
      
      if (stepData.requiresTools) {
        toolsBtn.style.display = 'flex';
      } else {
        toolsBtn.style.display = 'none';
      }
      
      // Ẩn map/video đi khi chuyển bước (để reset)
      mapContainer.style.display = 'none';
      mapContainer.innerHTML = '';
      toolsBtn.disabled = false;
      toolsBtn.innerHTML = '<span style="font-size: 1.25rem;">✚</span>';


      // --- BẮT ĐẦU CODE MỚI CHO VIDEO ---
      if (stepData.videoUrl) {
        mapContainer.innerHTML = `
          <video 
              width="100%" 
              height="300" 
              controls 
              autoplay 
              muted 
              loop 
              style="border-radius: 8px; background-color: #000;"
          >
              <source src="${stepData.videoUrl}" type="video/mp4">
              Trình duyệt của bạn không hỗ trợ thẻ video.
          </video>
        `;
        mapContainer.style.display = 'block';
      }
      // --- KẾT THÚC CODE MỚI CHO VIDEO ---
    }
    
    // (*** HÀM MỚI 1.9 ***) TÌM DỤNG CỤ GẦN ĐÂY
    function rescue_findNearbyTools() {
        const mapContainer = document.getElementById('rescue-map-container');
        const toolsBtn = document.getElementById('rescue-timeline-tools-btn');
        
        // 1. Hiển thị loading
        toolsBtn.disabled = true;
        toolsBtn.innerHTML = '<i class="bi bi-arrow-repeat rescue-spin-icon"></i>'; // Icon xoay
        
        mapContainer.style.display = 'block';
        mapContainer.innerHTML = `
            <div class="rescue-spinner-small"></div>
            <p class="text-gray-400 text-center text-sm italic">Đang tìm nhà thuốc gần nhất...</p>
        `;
        
        // 2. Giả lập delay 2 giây (thay cho việc lấy GPS)
        setTimeout(() => {
            const demoMapUrl = `https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3919.4471746439!2d106.69728807480579!3d10.77698888937176!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31752f38f1a18def%3A0x1d05a417c80088db!2zRGluaCDEkOG7mWMgTOG6rXA!5e0!3m2!1svi!2s!4v1730764619421!5m2!1svi!2s`; 
            
            mapContainer.innerHTML = `
                <p class="text-gray-400 text-center text-sm italic mb-2">Đã tìm thấy các vị trí! (Bản đồ minh họa)</p>
                <iframe 
                    width="100%" 
                    height="300" 
                    frameborder="0" 
                    style="border:0; border-radius: 8px;" 
                    src="${demoMapUrl}" 
                    allowfullscreen>
                </iframe>
            `;
            
            // 4. Reset nút (nhưng vẫn để nó bị disabled, vì đã tìm xong)
            toolsBtn.innerHTML = '<i class="bi bi-check-lg"></i>'; // Đổi icon thành "đã xong"

        }, 2000);
    }
    // (*** KẾT THÚC HÀM MỚI ***)


    // =================================
    // 💬 PHẦN 2: XỬ LÝ CHAT (CỘT PHẢI)
    // =================================

    const chatMessages = document.getElementById("rescue-chat-messages");
    const chatInput = document.getElementById("rescue-chat-input");
    const sendButton = document.getElementById("rescue-send-chat");

    async function rescue_sendChatMessage(messageOverride, isAuto = false) {
      const msg = messageOverride || chatInput.value.trim();
      if (!msg) return;

      const userCCD = rescue_getCurrentUserCCD();
      if (!userCCD) {
        alert(
          "Không tìm thấy thông tin định danh (CCD). Không thể gửi tin nhắn."
        );
        return;
      }

      if (!isAuto) {
        appendMessage(msg, "user-message");
        chatInput.value = "";
      }

      const loadingEl = appendMessage(
        "AI Rescue đang xử lý...",
        "ai-message",
        true
      );

      try {
        const res = await fetch(`https://workflow.emg.edu.vn:5678/webhook/rescue`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: msg,
            ccd: userCCD.cccd, // Sử dụng cccd từ đối tượng trả về
          }),
        });

        if (!res.ok) throw new Error(`Lỗi máy chủ: ${res.status}`);

        const data = await res.json();

        loadingEl.remove();

        const reply = data.output || data.reply || "AI không có phản hồi.";
        const replyHTML = reply; 

        appendMessage(replyHTML, "ai-message");
      } catch (e) {
        loadingEl.innerHTML = `<div>❌ Lỗi khi gọi AI Chat: ${e.message}</div>`;
        console.error("Chat API error:", e);
      }
    }

    function appendMessage(html, className, isLoading = false) {
      const msgWrapper = document.createElement("div");
      msgWrapper.className = className;

      if (isLoading) {
        msgWrapper.innerHTML = `<div class="italic opacity-70">${html}</div>`;
      } else {
        const proseClass = ""; 
        msgWrapper.innerHTML = `<div class="${proseClass}">${html.replace(/\n/g, '<br>')}</div>`;
      }

      chatMessages.appendChild(msgWrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msgWrapper;
    }

    // =============================
    // 🚀 KHỞI TẠO VÀ GẮN SỰ KIỆN
    // =============================

    // Gắn hàm vào global scope để HTML <button> có thể gọi
    window.rescue_captureFromCamera = rescue_captureFromCamera;
    window.rescue_uploadImage = rescue_uploadImage; 
    window.rescue_showFirstAidList = rescue_showFirstAidList; 

    // Sự kiện chat
    sendButton.addEventListener("click", () => rescue_sendChatMessage());
    chatInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        rescue_sendChatMessage();
      }
    });

    // Sự kiện cho file input
    document.getElementById('rescue-file-input').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        rescue_handleFileProcessing(file);
        event.target.value = null;
    });

    // Sự kiện cho các nút trong timeline popup
    document.getElementById('rescue-timeline-close').addEventListener('click', () => {
      document.getElementById('rescue-timeline-modal').style.display = 'none';
      rescueCurrentGuideKey = null; 
    });

    document.getElementById('rescue-timeline-back').addEventListener('click', () => {
      if (rescueCurrentStep > 0) {
        rescueCurrentStep--;
        rescue_updateTimelineContent();
      }
    });

    document.getElementById('rescue-timeline-next').addEventListener('click', () => {
      if (!rescueCurrentGuideKey) return;
      const guide = firstAidGuides.get(rescueCurrentGuideKey);
      if (rescueCurrentStep < guide.steps.length - 1) {
        rescueCurrentStep++;
        rescue_updateTimelineContent();
      }
    });

    document.getElementById('rescue-timeline-end').addEventListener('click', () => {
      document.getElementById('rescue-timeline-modal').style.display = 'none';
      rescueCurrentGuideKey = null; 
    });
    
    // (*** MỚI ***) GẮN SỰ KIỆN CHO NÚT TÌM DỤNG CỤ
    document.getElementById('rescue-timeline-tools-btn').addEventListener('click', rescue_findNearbyTools);
    // (*** KẾT THÚC MỚI ***)


    console.log("AI Rescue script initialized (v8 - Fixed POST & SessionStorage).");
})(); // Kết thúc IIFE
</script>
