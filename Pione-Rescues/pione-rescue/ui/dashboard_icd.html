<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Federated Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">🛡️ Admin Model Manager</h1>
                <p class="text-gray-500">Quản lý dữ liệu đóng góp từ Blockchain & Merge Model</p>
            </div>
            <div class="flex gap-3">
                <button onclick="loadContributions()" class="bg-white text-blue-600 px-4 py-2 rounded-lg shadow border hover:bg-gray-50">
                    <i class="bi bi-arrow-clockwise"></i> Refresh Data
                </button>
                <button onclick="mergeSelected()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg shadow hover:bg-indigo-700">
                    <i class="bi bi-git"></i> Merge Selected into Best.pt
                </button>
            </div>
        </header>

        <div class="grid grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                <div class="text-gray-500 text-sm">Tổng đóng góp (Pending)</div>
                <div class="text-3xl font-bold" id="stat-total">0</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                <div class="text-gray-500 text-sm">Model Version hiện tại</div>
                <div class="text-xl font-bold font-mono truncate" id="stat-version">v8.0.0</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-purple-500">
                <div class="text-gray-500 text-sm">Blockchain Node Status</div>
                <div class="text-xl font-bold text-green-600">Connected 🟢</div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-4 w-10"><input type="checkbox" id="select-all"></th>
                        <th class="p-4 text-sm font-semibold text-gray-600">ID / Contributor</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Nội dung Training (ICD)</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Tham số (Params)</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Trạng thái</th>
                        <th class="p-4 text-sm font-semibold text-gray-600">Action</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const BLOCKCHAIN_API = "http://localhost:3005/api";
        const PYTHON_API = "http://localhost:3004";

        async function loadContributions() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500">Đang tải dữ liệu từ Blockchain...</td></tr>';

            try {
                // 1. Lấy số lượng đóng góp từ Blockchain
                const countRes = await fetch(`${BLOCKCHAIN_API}/contributions/count`);
                const countData = await countRes.json();
                const count = countData.count || 0;
                document.getElementById('stat-total').innerText = count;

                // 2. Lấy chi tiết (Lấy 10 cái mới nhất)
                let rowsHtml = '';
                const start = Math.max(0, count - 10);
                
                for (let i = count - 1; i >= start; i--) {
                    const detailRes = await fetch(`${BLOCKCHAIN_API}/contributions/details/${i}`);
                    const item = await detailRes.json();
                    
                    // Giả sử item trả về: { contributor, cid, ... }
                    const cid = item.cid || item[1];
                    const contributor = item.contributor || item[0];

                    rowsHtml += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-4"><input type="checkbox" class="row-checkbox" value="${cid}"></td>
                            <td class="p-4">
                                <div class="font-bold text-gray-800">Block #${i}</div>
                                <div class="text-xs text-gray-500 font-mono">${contributor.substring(0,10)}...</div>
                            </td>
                            <td class="p-4">
                                <div class="text-sm font-bold text-blue-600 mb-1">IPFS CID</div>
                                <a href="https://gateway.pinata.cloud/ipfs/${cid}" target="_blank" class="text-xs font-mono text-gray-500 hover:text-blue-500 hover:underline">
                                    ${cid} <i class="bi bi-box-arrow-up-right"></i>
                                </a>
                            </td>
                            <td class="p-4">
                                <span class="bg-yellow-100 text-yellow-700 text-xs px-2 py-1 rounded-full">Training Diff</span>
                                <div class="text-xs text-gray-400 mt-1">Weights: [0.23, -0.11...]</div>
                            </td>
                            <td class="p-4"><span class="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded">Verified</span></td>
                            <td class="p-4">
                                <button class="text-gray-400 hover:text-indigo-600"><i class="bi bi-three-dots-vertical"></i></button>
                            </td>
                        </tr>
                    `;
                }
                tbody.innerHTML = rowsHtml || '<tr><td colspan="6" class="text-center p-4">Chưa có dữ liệu</td></tr>';

            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Lỗi kết nối Node.js: ${e.message}</td></tr>`;
            }
        }

        async function mergeSelected() {
            const selected = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => cb.value);
            
            if (selected.length === 0) return alert("Vui lòng chọn ít nhất 1 đóng góp để merge!");

            const btn = document.querySelector('button[onclick="mergeSelected()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="bi bi-gear-wide animate-spin"></i> Processing...';
            btn.disabled = true;

            try {
                const res = await fetch(`${PYTHON_API}/fl/merge-model`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cids: selected })
                });
                const data = await res.json();
                
                if (res.ok) {
                    alert(`🎉 Thành công!\n${data.message}\nNew Global Model: ${data.new_model_version}`);
                    document.getElementById('stat-version').innerText = data.new_model_version.substring(0, 15) + "...";
                } else {
                    alert("Lỗi: " + JSON.stringify(data));
                }
            } catch (e) {
                alert("Lỗi kết nối Python Backend!");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        loadContributions();
    </script>
</body>
</html>
