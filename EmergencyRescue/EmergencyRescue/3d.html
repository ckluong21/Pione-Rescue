<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot 3D</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Importmap cho Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <style>
        /* Đảm bảo canvas lấp đầy vùng chứa */
        #modelCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* ĐÃ XÓA: CSS cho #webcamVideo */

        /* CSS cho trình tải (loader) nhỏ trong ô chat */
        .loader {
            border: 4px solid #f3f3ff;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ĐÃ THÊM: CSS cho giao diện chat */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            /* Thêm thanh cuộn mượt mà */
            scrollbar-width: thin;
            scrollbar-color: #4a5568 #2d3748;
        }
        .chat-message {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            max-width: 80%;
            line-height: 1.5;
        }
        .user-message {
            background-color: #3182ce; /* Màu xanh cho người dùng */
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        .model-message {
            background-color: #4a5568; /* Màu xám cho mô hình */
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        .loading-indicator {
            align-self: flex-start;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden h-screen flex flex-col p-4 gap-4">

    <h1 class="text-2xl font-bold text-center">Chat với Mô hình 3D</h1>

    <!-- ĐÃ THÊM: Nút điều khiển Animation -->
    <div class="flex justify-center items-center gap-4 mb-2">
        <button id="idle-button" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-all shadow-md">
            Chạy "Idle"
        </button>
        <button id="walk-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-all shadow-md">
            Chạy "Walk"
        </button>
        <button id="stop-button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-all shadow-md">
            Dừng Animation
        </button>
    </div>

    <!-- Vùng chứa chính cho 2 màn hình -->
    <!-- ĐÃ SỬA: Điều chỉnh chiều cao h-[...] để thêm không gian cho các nút mới -->
    <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 h-[calc(100vh-150px)]">
        
        <!-- Màn hình Chat -->
        <div class="bg-gray-800 rounded-lg overflow-hidden shadow-lg flex flex-col h-full">
            <div class="p-3 border-b border-gray-700 text-center font-semibold">
                Bảng điều khiển Chat
            </div>
            
            <!-- ... existing code ... */ -->
            <div id="chat-container">
                <!-- Tin nhắn chào mừng -->
                <div class="model-message">
                    Xin chào! Bạn có thể hỏi tôi bất cứ điều gì.
                </div>
            </div>
            
            <!-- ... existing code ... */ -->
            <form id="chat-form" class="p-4 border-t border-gray-700 flex gap-2">
                <input id="chat-input" type="text" placeholder="Nhập tin nhắn của bạn..." class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" autocomplete="off">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-lg transition-all shadow-md">
                    Gửi
                </button>
            </form>
        </div>
        
        <!-- Màn hình Mô hình 3D -->
        <div id="canvasContainer" class="bg-gray-800 rounded-lg overflow-hidden relative shadow-lg">
            <canvas id="modelCanvas"></canvas>
            <div class="absolute top-2 right-2 bg-black bg-opacity-50 px-3 py-1 rounded-full text-sm">Mô hình 3D</div>
        </div>
    </div>

    <script type="module">
        // Import (vẫn giữ nguyên)
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Biến 3D
        let scene, camera, renderer, model, mixer, clock, controls;
        // ĐÃ THÊM: Biến để quản lý animations
        let animationClips = {}; // Lưu trữ tất cả các clip (dưới dạng action)
        let activeAction = null; // Theo dõi action đang chạy

        // DOM Elements
        const canvasContainer = document.getElementById('canvasContainer');
        const canvas = document.getElementById('modelCanvas');
        
        // DOM elements cho Chat
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        
        // ĐÃ THÊM: DOM elements cho các nút điều khiển
        const idleButton = document.getElementById('idle-button');
        const walkButton = document.getElementById('walk-button');
        const stopButton = document.getElementById('stop-button');
        
        const modelFile = 'skle02.glb'; 

        // --- 1. Khởi tạo Cảnh 3D ---
        function init3D() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();

            // Camera
            camera = new THREE.PerspectiveCamera(75, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 1000);
            camera.position.set(0, 1, 2); 
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding; 

            // Ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); 
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0); 
            directionalLight.position.set(2, 5, 3);
            scene.add(directionalLight);

            // Điều khiển
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.8, 0); 
            controls.update();

            // Tải mô hình
            const loader = new GLTFLoader();
            loader.load(modelFile, (gltf) => {
                model = gltf.scene;
                
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 1.6 / maxDim; 
                model.scale.set(scale, scale, scale);
                model.position.sub(center.multiplyScalar(scale)); 
                
                scene.add(model);
                console.log("Tải mô hình thành công!");

                // ĐÃ SỬA: Logic xử lý Animation
                if (gltf.animations && gltf.animations.length) {
                    mixer = new THREE.AnimationMixer(model);
                    animationClips = {}; // Xóa clip cũ
                    
                    const animationNames = [];
                    
                    gltf.animations.forEach((clip) => {
                        const action = mixer.clipAction(clip);
                        animationClips[clip.name] = action; // Lưu action bằng tên
                        animationNames.push(clip.name);
                    });

                    // Quan trọng: Ghi log các tên animation tìm thấy
                    console.log("Tìm thấy các animations:", animationNames);
                    
                    // KHÔNG tự động phát bất cứ gì cả.
                    // Mô hình sẽ đứng yên (T-pose hoặc A-pose)

                } else {
                    console.log("Không tìm thấy animations trong mô hình.");
                }
                
                animate();
            }, undefined, (error) => {
                console.error("Lỗi khi tải mô hình:", error);
                console.error("Không thể tải tệp  Vui lòng đảm bảo tệp nằm cùng thư mục.");
            });

            // Xử lý thay đổi kích thước cửa sổ
            window.addEventListener('resize', onWindowResize);
            onWindowResize(); // Chạy lần đầu
        }
        
        function onWindowResize() {
            const w = canvasContainer.clientWidth;
            const h = canvasContainer.clientHeight;
            
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        // Vòng lặp Animation (vẫn giữ nguyên)
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            if (mixer) {
                mixer.update(delta); // Luôn cập nhật mixer
            }
            controls.update();
            renderer.render(scene, camera);
        }
        
        // --- 2. Chức năng Chat ---

        // ĐÃ THÊM: Hàm trợ giúp để phát animation cụ thể
        function playAnimation(name) {
            const newAction = animationClips[name];

            // Cảnh báo nếu không tìm thấy tên animation
            if (!newAction) {
                console.warn(`Không tìm thấy animation tên là: '${name}'`);
                // Hiển thị các tên có thể dùng
                console.log("Các animation có sẵn:", Object.keys(animationClips));
                return;
            }

            // Không làm gì nếu animation này đã chạy rồi
            if (activeAction === newAction) {
                return; 
            }

            // Dừng animation cũ (nếu có) một cách mượt mà
            if (activeAction) {
                activeAction.fadeOut(0.3);
            }

            // Chạy animation mới
            newAction
                .reset()
                .setLoop(THREE.LoopRepeat) // Đảm bảo nó lặp lại
                .fadeIn(0.3) // Xuất hiện mượt mà
                .play();
            
            activeAction = newAction; // Cập nhật action đang chạy
        }

        // ĐÃ THÊM: Hàm trợ giúp để dừng mọi animation
        function stopAllAnimations() {
            if (activeAction) {
                activeAction.fadeOut(0.3);
                activeAction = null;
            }
        }

        // Hàm thêm tin nhắn vào giao diện chat
        function addMessageToChat(sender, text) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('chat-message');
            
            if (sender === 'user') {
                messageElement.classList.add('user-message');
                messageElement.textContent = text;
            } else if (sender === 'model') {
                messageElement.classList.add('model-message');
                messageElement.textContent = text; // Gemini API trả về text
            } else if (sender === 'loading') {
                messageElement.classList.add('model-message', 'loading-indicator');
                messageElement.innerHTML = '<div class="loader" style="width: 20px; height: 20px; border-width: 3px;"></div>'; // Loader nhỏ hơn
            }
            
            chatContainer.appendChild(messageElement);
            
            // Tự động cuộn xuống dưới cùng
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageElement; // Trả về element để có thể xóa (ví dụ: xóa loader)
        }

        // Hàm xử lý gửi form
        async function handleChatSubmit(event) {
            event.preventDefault();
            const userMessage = chatInput.value.trim();
            
            if (userMessage === "") return;
            
            // Thêm tin nhắn của người dùng vào chat
            addMessageToChat('user', userMessage);
            chatInput.value = ""; // Xóa input
            
            // Thêm chỉ báo đang tải...
            const loadingIndicator = addMessageToChat('loading');
            
            try {
                // Gọi API Gemini để lấy phản hồi
                const modelResponse = await getGeminiResponse(userMessage);
                
                // Xóa chỉ báo đang tải
                chatContainer.removeChild(loadingIndicator);
                
                // Thêm phản hồi của mô hình vào chat
                addMessageToChat('model', modelResponse);

            } catch (error) {
                // Xóa chỉ báo đang tải
                chatContainer.removeChild(loadingIndicator);
                // Thêm tin nhắn lỗi
                addMessageToChat('model', "Xin lỗi, tôi gặp sự cố khi kết nối. Vui lòng thử lại.");
                console.error("Lỗi khi lấy phản hồi Gemini:", error);
            }
        }
        
        // Hàm gọi API Gemini (Text Generation)
        async function getGeminiResponse(prompt) {
            const apiKey = ""; // API key sẽ được tự động cung cấp
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                // Thêm system instruction để nó trả lời ngắn gọn, thân thiện
                systemInstruction: {
                    parts: [{ text: "Bạn là một trợ lý AI thân thiện. Hãy trả lời một cách ngắn gọn, trực tiếp và hữu ích." }]
                },
            };

            let retries = 3;
            let delay = 1000;
            let response = null;

            while (retries > 0) {
                try {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) break; // Thành công

                    console.warn(`Lỗi API (lần thử ${4-retries}): ${response.status}`);
                    if (response.status === 429 || response.status >= 500) {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                        retries--;
                    } else {
                        throw new Error(`Lỗi API không thể thử lại: ${response.status}`);
                    }
                } catch (error) {
                    console.error("Lỗi fetch:", error);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                    retries--;
                }
            }

            if (!response || !response.ok) {
                throw new Error("Không thể lấy phản hồi từ API sau nhiều lần thử.");
            }

            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;

            if (text) {
                return text;
            } else {
                console.error("Phản hồi API không hợp lệ:", result);
                throw new Error("Không nhận được dữ liệu văn bản hợp lệ.");
            }
        }

        // --- 3. Gắn kết sự kiện ---
        chatForm.addEventListener('submit', handleChatSubmit);
        
        // ĐÃ THÊM: Gắn kết sự kiện cho các nút điều khiển animation
        idleButton.addEventListener('click', () => playAnimation('Information'));
        walkButton.addEventListener('click', () => playAnimation('number'));
        stopButton.addEventListener('click', stopAllAnimations);

        // --- 4. Chạy ứng dụng ---
        init3D(); // Chỉ khởi tạo 3D

    </script>
</body>
</html>
